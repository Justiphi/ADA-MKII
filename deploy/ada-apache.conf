# Apache vhost for ADA. Install to /etc/apache2/sites-available/ada.conf
#
# One hostname, two upstreams: /api and /health go to ADA-MKII-Server, everything
# else to ADA-MKII-Web. That keeps a single certificate and gives the phone one
# address to remember, which matters because it is typed in by hand.
#
# Required modules:
#   a2enmod proxy proxy_http proxy_wstunnel headers rewrite ssl
#
# proxy_wstunnel is NOT optional. Blazor Server runs the UI over a WebSocket at
# /_blazor; without it the page loads and then sits there failing to reconnect.

<VirtualHost *:80>
    ServerName ada.example.com
    # certbot rewrites this to redirect to HTTPS.
    RedirectPermanent / https://ada.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName ada.example.com

    SSLEngine on
    # certbot --apache fills these in.
    # SSLCertificateFile    /etc/letsencrypt/live/ada.example.com/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/ada.example.com/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off

    # Tell the apps they are behind TLS. Without these the API sees every request
    # as coming from 127.0.0.1 - which collapses the per-IP rate limiter into a
    # single shared bucket - and the web head's HTTPS redirect can loop.
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # --- Blazor's WebSocket circuit. Must come before the catch-all. ---
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://127.0.0.1:5200/$1 [P,L]

    # --- The API ---
    ProxyPass        /api  http://127.0.0.1:5100/api
    ProxyPassReverse /api  http://127.0.0.1:5100/api
    ProxyPass        /health  http://127.0.0.1:5100/health
    ProxyPassReverse /health  http://127.0.0.1:5100/health

    # --- The web UI ---
    ProxyPass        /  http://127.0.0.1:5200/
    ProxyPassReverse /  http://127.0.0.1:5200/

    # POST /api/chat is server-sent events. Compression buffers the stream and
    # the reply would arrive in one lump at the end instead of word by word.
    SetEnvIfNoCase Request_URI ^/api/chat no-gzip=1
    <Location /api/chat>
        SetEnv no-gzip 1
        SetEnv dont-vary 1
    </Location>

    ErrorLog  ${APACHE_LOG_DIR}/ada-error.log
    CustomLog ${APACHE_LOG_DIR}/ada-access.log combined
</VirtualHost>
